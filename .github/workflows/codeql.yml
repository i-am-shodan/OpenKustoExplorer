name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          # Build analyzers enforce quality; CodeQL remains focused on security findings.
          queries: security-extended

      - name: Restore WebAssembly workload
        run: dotnet workload restore src/OpenKustoExplorer.Browser/OpenKustoExplorer.Browser.csproj

      - name: Restore dependencies
        run: dotnet restore OpenKustoExplorer.slnx

      - name: Build for CodeQL
        run: dotnet build OpenKustoExplorer.slnx --configuration Release --no-restore -warnaserror

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          post-processed-sarif-path: artifacts/codeql-sarif

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: artifacts/codeql-sarif
          if-no-files-found: error
          retention-days: 14