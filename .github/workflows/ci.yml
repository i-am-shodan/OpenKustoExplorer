name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: NuGet audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore and audit all dependencies
        run: dotnet restore OpenKustoExplorer.slnx -p:AuditPipeline=true

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test release version scripts
        shell: pwsh
        run: ./scripts/Test-ReleaseVersionScripts.ps1

      - name: Resolve build version
        id: resolve
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $version = @(& ./scripts/Resolve-ReleaseVersion.ps1)
          }
          else {
            $version = @(& ./scripts/Resolve-ReleaseVersion.ps1 -VersionFloorOnly)
          }

          if ($version.Count -ne 1 -or $version[0] -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release version resolution returned an invalid result: $($version -join ', ')"
          }

          "version=$($version[0])" >> $env:GITHUB_OUTPUT
          "Build version: $($version[0])" >> $env:GITHUB_STEP_SUMMARY

  quality:
    name: Quality (${{ matrix.os }})
    needs: [audit, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
            architecture: arm64
          - os: macos-15-intel
            rid: osx-x64
            architecture: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang unzip zip zlib1g-dev

      - name: Restore
        run: dotnet restore OpenKustoExplorer.slnx

      - name: Test coverage scripts
        shell: pwsh
        run: ./scripts/Test-CodeCoverageScripts.ps1

      - name: Test macOS application bundle script
        shell: pwsh
        run: ./scripts/Test-MacOSApplicationBundle.ps1

      - name: Verify formatting
        run: dotnet format OpenKustoExplorer.slnx --verify-no-changes --no-restore

      - name: Build without warnings
        run: dotnet build OpenKustoExplorer.slnx --configuration Release --no-restore -warnaserror -p:Version=${{ needs.version.outputs.version }}

      - name: Verify embedded desktop version
        shell: pwsh
        run: |
          $assemblyPath = 'src/OpenKustoExplorer.Desktop/bin/Release/net10.0/OpenKustoExplorer.dll'
          $actual = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $assemblyPath)).Version.ToString(3)
          $expected = '${{ needs.version.outputs.version }}'
          if ($actual -ne $expected) {
            throw "Desktop assembly version $actual does not match resolved release version $expected."
          }

      - name: Run tests
        if: runner.os == 'Linux'
        run: dotnet test OpenKustoExplorer.slnx --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Run tests with coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Measure-CodeCoverage.ps1 -Configuration Release -UseExistingBuild -MinimumLineRate 75
          Get-Content artifacts/coverage/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: |
            artifacts/coverage/raw/**/coverage.cobertura.xml
            artifacts/coverage/summary.json
            artifacts/coverage/summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish Native AOT smoke harness
        run: dotnet publish tests/OpenKustoExplorer.AotSmoke/OpenKustoExplorer.AotSmoke.csproj --configuration Release --runtime ${{ matrix.rid }} --output artifacts/aot-smoke -warnaserror -p:Version=${{ needs.version.outputs.version }}

      - name: Run Windows Native AOT smoke harness
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./artifacts/aot-smoke/OpenKustoExplorer.AotSmoke.exe

      - name: Run Linux Native AOT smoke harness
        if: runner.os == 'Linux'
        run: ./artifacts/aot-smoke/OpenKustoExplorer.AotSmoke

      - name: Run macOS Native AOT smoke harness
        if: runner.os == 'macOS'
        run: ./artifacts/aot-smoke/OpenKustoExplorer.AotSmoke

      - name: Publish desktop Native AOT bundle
        run: dotnet publish src/OpenKustoExplorer.Desktop/OpenKustoExplorer.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --output artifacts/desktop -warnaserror -p:Version=${{ needs.version.outputs.version }}

      - name: Stage macOS application bundle
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          ./scripts/New-MacOSApplicationBundle.ps1 `
            -PublishRoot 'artifacts/desktop' `
            -BinaryStagingRoot 'artifacts/release-staging/binaries' `
            -SymbolStagingRoot 'artifacts/release-staging/symbols' `
            -Version '${{ needs.version.outputs.version }}'

      - name: Package macOS archives
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          mkdir -p artifacts/release
          chmod +x artifacts/release-staging/binaries/OpenKustoExplorer.app/Contents/MacOS/OpenKustoExplorer
          (cd artifacts/release-staging/binaries && zip -q -r "../../release/OpenKustoExplorer-${version}-${{ matrix.rid }}.zip" .)
          (cd artifacts/release-staging/symbols && zip -q -r "../../release/OpenKustoExplorer-${version}-${{ matrix.rid }}-symbols.zip" .)

      - name: Upload desktop bundle
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: OpenKustoExplorer-${{ matrix.rid }}
          path: |
            artifacts/desktop
            !artifacts/desktop/**/*.pdb
            !artifacts/desktop/**/*.dbg
            !artifacts/desktop/**/*.xml
          if-no-files-found: error
          compression-level: 9

      - name: Upload desktop symbols and documentation
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: OpenKustoExplorer-${{ matrix.rid }}-symbols
          path: |
            artifacts/desktop/**/*.pdb
            artifacts/desktop/**/*.dbg
            artifacts/desktop/**/*.xml
          if-no-files-found: error
          compression-level: 9

      - name: Upload macOS application bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: OpenKustoExplorer-${{ matrix.rid }}
          path: artifacts/release/OpenKustoExplorer-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload macOS symbols and documentation
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: OpenKustoExplorer-${{ matrix.rid }}-symbols
          path: artifacts/release/OpenKustoExplorer-${{ needs.version.outputs.version }}-${{ matrix.rid }}-symbols.zip
          if-no-files-found: error
          compression-level: 0

      - name: Stage release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os != 'macOS'
        shell: pwsh
        run: |
          $publishRoot = (Resolve-Path 'artifacts/desktop').Path
          $binaryRoot = Join-Path $PWD 'artifacts/release-staging/binaries'
          $symbolRoot = Join-Path $PWD 'artifacts/release-staging/symbols'
          Remove-Item (Join-Path $PWD 'artifacts/release-staging') -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $binaryRoot, $symbolRoot, 'artifacts/release' | Out-Null
          $binaryCount = 0
          $symbolCount = 0

          foreach ($file in Get-ChildItem $publishRoot -Recurse -File) {
            $relativePath = [IO.Path]::GetRelativePath($publishRoot, $file.FullName)
            $isSymbol = $file.Extension -in '.pdb', '.dbg', '.xml'
            $targetRoot = $isSymbol ? $symbolRoot : $binaryRoot
            $targetPath = Join-Path $targetRoot $relativePath
            New-Item -ItemType Directory -Path (Split-Path -Parent $targetPath) -Force | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $targetPath
            if ($isSymbol) {
              $symbolCount++
            }
            else {
              $binaryCount++
            }
          }

          if ($binaryCount -eq 0 -or $symbolCount -eq 0) {
            throw "Release staging requires binary and symbol files; found $binaryCount binaries and $symbolCount symbols."
          }

      - name: Package Windows release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          Compress-Archive -Path 'artifacts/release-staging/binaries/*' -DestinationPath "artifacts/release/OpenKustoExplorer-$version-${{ matrix.rid }}.zip"
          Compress-Archive -Path 'artifacts/release-staging/symbols/*' -DestinationPath "artifacts/release/OpenKustoExplorer-$version-${{ matrix.rid }}-symbols.zip"

      - name: Verify Windows release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $checkRoot = Join-Path $PWD 'artifacts/archive-check'
          Expand-Archive "artifacts/release/OpenKustoExplorer-$version-${{ matrix.rid }}.zip" -DestinationPath (Join-Path $checkRoot 'binaries')
          Expand-Archive "artifacts/release/OpenKustoExplorer-$version-${{ matrix.rid }}-symbols.zip" -DestinationPath (Join-Path $checkRoot 'symbols')
          $application = Join-Path $checkRoot 'binaries/OpenKustoExplorer.exe'
          if (-not (Test-Path -LiteralPath $application -PathType Leaf) -or (Get-Item $application).Length -eq 0) {
            throw 'The Windows release archive does not contain a non-empty OpenKustoExplorer.exe.'
          }

          if (@(Get-ChildItem (Join-Path $checkRoot 'symbols') -Recurse -File).Count -eq 0) {
            throw 'The Windows symbols archive is empty.'
          }

      - name: Package Linux release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          chmod +x artifacts/release-staging/binaries/OpenKustoExplorer
          (cd artifacts/release-staging/binaries && zip -q -r "../../release/OpenKustoExplorer-${version}-${{ matrix.rid }}.zip" .)
          (cd artifacts/release-staging/symbols && zip -q -r "../../release/OpenKustoExplorer-${version}-${{ matrix.rid }}-symbols.zip" .)

      - name: Verify Linux release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          rm -rf artifacts/archive-check
          mkdir -p artifacts/archive-check/binaries artifacts/archive-check/symbols
          unzip -q "artifacts/release/OpenKustoExplorer-${version}-${{ matrix.rid }}.zip" -d artifacts/archive-check/binaries
          unzip -q "artifacts/release/OpenKustoExplorer-${version}-${{ matrix.rid }}-symbols.zip" -d artifacts/archive-check/symbols
          test -s artifacts/archive-check/binaries/OpenKustoExplorer
          test -x artifacts/archive-check/binaries/OpenKustoExplorer
          test -n "$(find artifacts/archive-check/symbols -type f -print -quit)"

      - name: Verify macOS release archives
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          rm -rf artifacts/archive-check
          mkdir -p artifacts/archive-check/binaries artifacts/archive-check/symbols
          unzip -q "artifacts/release/OpenKustoExplorer-${version}-${{ matrix.rid }}.zip" -d artifacts/archive-check/binaries
          unzip -q "artifacts/release/OpenKustoExplorer-${version}-${{ matrix.rid }}-symbols.zip" -d artifacts/archive-check/symbols
          application='artifacts/archive-check/binaries/OpenKustoExplorer.app/Contents/MacOS/OpenKustoExplorer'
          plist='artifacts/archive-check/binaries/OpenKustoExplorer.app/Contents/Info.plist'
          test -s "${application}"
          test -x "${application}"
          test -s artifacts/archive-check/binaries/OpenKustoExplorer.app/Contents/Resources/OpenKustoExplorer.icns
          plutil -lint "${plist}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${plist}")" = 'OpenKustoExplorer'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "${plist}")" = 'Kusto Explorer'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${plist}")" = 'Open Kusto Explorer'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")" = 'io.github.i-am-shodan.OpenKustoExplorer'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")" = "${version}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}")" = "${version}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${plist}")" = '14.0'
          test "$(lipo -archs "${application}")" = '${{ matrix.architecture }}'
          test -n "$(find artifacts/archive-check/symbols/OpenKustoExplorer.dSYM -type f -print -quit)"

      - name: Upload release packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ matrix.rid }}
          path: artifacts/release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create GitHub release
    needs: [version, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-release
      cancel-in-progress: false

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-packages-*
          path: artifacts/release
          merge-multiple: true

      - name: Verify release packages
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $expected = @(
            "OpenKustoExplorer-$version-win-x64.zip",
            "OpenKustoExplorer-$version-win-x64-symbols.zip",
            "OpenKustoExplorer-$version-linux-x64.zip",
            "OpenKustoExplorer-$version-linux-x64-symbols.zip",
            "OpenKustoExplorer-$version-osx-arm64.zip",
            "OpenKustoExplorer-$version-osx-arm64-symbols.zip",
            "OpenKustoExplorer-$version-osx-x64.zip",
            "OpenKustoExplorer-$version-osx-x64-symbols.zip"
          )

          foreach ($fileName in $expected) {
            $path = Join-Path 'artifacts/release' $fileName
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item $path).Length -eq 0) {
              throw "Required release package '$fileName' is missing or empty."
            }
          }

      - name: Create release and source tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          files=(
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-win-x64.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-win-x64-symbols.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-linux-x64.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-linux-x64-symbols.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-osx-arm64.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-osx-arm64-symbols.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-osx-x64.zip"
            "artifacts/release/OpenKustoExplorer-${RELEASE_VERSION}-osx-x64-symbols.zip"
          )

          git fetch --force --tags origin
          existing_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}" 2>/dev/null || true)"
          if [[ -n "${existing_commit}" && "${existing_commit}" != "${RELEASE_SHA}" ]]; then
            echo "Tag ${tag} points to ${existing_commit}, not ${RELEASE_SHA}." >&2
            exit 1
          fi

          release_record="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${tag}\") | [.id, .draft, .target_commitish] | @tsv"
          )"
          if [[ -n "${release_record}" ]]; then
            IFS=$'\t' read -r release_id release_is_draft release_target <<< "${release_record}"
            if [[ "${release_target}" != "${RELEASE_SHA}" ]]; then
              echo "Release ${tag} targets ${release_target}, not ${RELEASE_SHA}." >&2
              exit 1
            fi

            echo "Release ${tag} already exists; id=${release_id}, draft=${release_is_draft}."
          else
            release_id="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="${tag}" \
                -f target_commitish="${RELEASE_SHA}" \
                -F draft=true \
                -F prerelease=false \
                -F generate_release_notes=true \
                -f make_latest=false \
                --jq '.id'
            )"
            release_is_draft=true
            echo "Created draft release ${tag}; id=${release_id}."
          fi

          get_remote_assets() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --jq '.assets[] | [.id, .name, (.size | tostring), .state, (.digest // "")] | @tsv'
          }

          asset_is_complete() {
            local file="$1"
            local file_name file_size file_hash file_digest
            file_name="$(basename "${file}")"
            file_size="$(stat --format='%s' "${file}")"
            read -r file_hash _ < <(sha256sum "${file}")
            file_digest="sha256:${file_hash}"

            while IFS=$'\t' read -r _ asset_name asset_size asset_state asset_digest; do
              if [[ "${asset_name}" == "${file_name}" \
                && "${asset_size}" == "${file_size}" \
                && "${asset_state}" == uploaded \
                && "${asset_digest}" == "${file_digest}" ]]; then
                return 0
              fi
            done <<< "${remote_assets}"

            return 1
          }

          upload_asset() {
            local file="$1"
            local file_name attempt
            file_name="$(basename "${file}")"

            for attempt in 1 2 3; do
              echo "Uploading ${file_name} (attempt ${attempt}/3)."
              if gh release upload "${tag}" "${file}" --clobber; then
                return 0
              fi

              if [[ "${attempt}" -lt 3 ]]; then
                sleep "$((attempt * 15))"
              fi
            done

            echo "Failed to upload ${file_name} after 3 attempts." >&2
            return 1
          }

          remote_assets="$(get_remote_assets)"
          for file in "${files[@]}"; do
            if asset_is_complete "${file}"; then
              echo "$(basename "${file}") is already complete; skipping upload."
              continue
            fi

            if [[ "${release_is_draft}" != true ]]; then
              echo "Published release ${tag} is missing a complete asset matching $(basename "${file}")." >&2
              exit 1
            fi

            upload_asset "${file}"
            remote_assets="$(get_remote_assets)"
          done

          remote_assets="$(get_remote_assets)"
          for file in "${files[@]}"; do
            if ! asset_is_complete "${file}"; then
              echo "Release ${tag} is missing a complete asset matching $(basename "${file}")." >&2
              exit 1
            fi
          done

          if [[ "${release_is_draft}" == true ]]; then
            gh release edit "${tag}" --draft=false --latest
          fi

          release_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --jq '[.draft, .prerelease] | @tsv'
          )"
          if [[ "${release_state}" != $'false\tfalse' ]]; then
            echo "Release ${tag} was not published as a stable release: ${release_state}." >&2
            exit 1
          fi

          git fetch --force --tags origin
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [[ "${tagged_commit}" != "${RELEASE_SHA}" ]]; then
            echo "Created tag ${tag} points to ${tagged_commit}, not ${RELEASE_SHA}." >&2
            exit 1
          fi

          latest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true
          )"
          latest_tag="$(
            printf '%s\n' "${latest_tag}" |
              sort -V |
              tail -n 1
          )"
          if [[ -z "${latest_tag}" ]]; then
            echo 'No published stable SemVer release is available to mark latest.' >&2
            exit 1
          fi

          gh release edit "${latest_tag}" --latest
          actual_latest_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name'
          )"
          if [[ "${actual_latest_tag}" != "${latest_tag}" ]]; then
            echo "Latest release is ${actual_latest_tag}, not ${latest_tag}." >&2
            exit 1
          fi

          echo "Released ${tag} from ${RELEASE_SHA}." >> "${GITHUB_STEP_SUMMARY}"
